name: Validate Media

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "psbbv-node.json"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "psbbv-node.json"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate contract and host catalogue
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate schema and manifest
        run: python tests/validate_manifest.py
      - name: Validate node identity and readiness
        run: python tests/test_node_identity.py
      - name: Build and run host catalogue tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
